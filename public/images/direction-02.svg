<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="presentation">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="1.4" fill="rgba(31,31,28,0.3)"/>
    </pattern>
  </defs>

  <rect width="1000" height="1000" fill="#EDE8DE"/>
  <rect x="0" y="300" width="1000" height="240" fill="#1F1F1C" opacity="0.9"/>
  <circle cx="500" cy="420" r="118" fill="#EDE8DE"/>
  <circle cx="500" cy="420" r="52" fill="#540212"/>
  <rect x="0" y="620" width="1000" height="380" fill="url(#dots)" opacity="0.75"/>
<rect width="1000" height="1000" filter="url(#grain)" opacity="0.2" style="mix-blend-mode:multiply"/>
</svg>
