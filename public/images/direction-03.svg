<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="presentation">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.15" fill="rgba(31,31,28,0.24)"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#EDE8DE"/>
  <path d="M0 620 L 800 190 L 800 420 L 0 850 Z" fill="#540212"/>
  <path d="M0 880 L 800 450 L 800 520 L 0 950 Z" fill="#173F35"/>
  <rect x="0" y="0" width="800" height="230" fill="url(#dots)" opacity="0.7"/>
<rect width="800" height="1000" filter="url(#grain)" opacity="0.22" style="mix-blend-mode:multiply"/>
</svg>
