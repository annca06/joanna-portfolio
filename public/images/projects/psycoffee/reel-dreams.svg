<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="presentation">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.2" fill="rgba(247,244,239,0.4)"/>
    </pattern>
  </defs>

  <rect width="900" height="1600" fill="#173F35"/>
  <circle cx="450" cy="620" r="300" fill="#EDE8DE"/>
  <rect x="0" y="920" width="900" height="680" fill="url(#dots)" opacity="0.5"/>
  <rect x="64" y="1180" width="772" height="1" fill="#F7F4EF" opacity="0.4"/>

  <text x="64" y="120" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="500"
        letter-spacing="5.2" fill="#F7F4EF" opacity="0.78">PLACEHOLDER</text>
  <text x="64" y="1516" font-family="Georgia, 'Times New Roman', serif" font-size="46"
        fill="#F7F4EF">Dreams</text>

  <rect width="900" height="1600" filter="url(#grain)" opacity="0.24" style="mix-blend-mode:multiply"/>
</svg>
