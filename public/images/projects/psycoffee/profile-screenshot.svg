<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="presentation">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.15" fill="rgba(31,31,28,0.22)"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#EDE8DE"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#dots)" opacity="0.5"/>

  <!-- A phone-shaped plate, to suggest the shape of the asset that goes here -->
  <rect x="668" y="86" width="264" height="728" fill="#173F35"/>
  <rect x="668" y="86" width="264" height="150" fill="#540212"/>
  <circle cx="800" cy="420" r="74" fill="#EDE8DE" opacity="0.92"/>
  <rect x="706" y="560" width="188" height="1" fill="#EDE8DE" opacity="0.45"/>
  <rect x="706" y="612" width="188" height="1" fill="#EDE8DE" opacity="0.45"/>
  <rect x="706" y="664" width="188" height="1" fill="#EDE8DE" opacity="0.45"/>

  <rect x="96" y="96" width="1408" height="1" fill="#1F1F1C" opacity="0.42"/>
  <rect x="96" y="803" width="1408" height="1" fill="#1F1F1C" opacity="0.42"/>

  <text x="96" y="72" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="500"
        letter-spacing="5.2" fill="#540212">IMAGE PLACEHOLDER</text>
  <text x="96" y="852" font-family="Georgia, 'Times New Roman', serif" font-size="30"
        fill="#1F1F1C" opacity="0.62">Instagram profile screenshot / device mockup / editorial composition</text>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.2" style="mix-blend-mode:multiply"/>
</svg>
