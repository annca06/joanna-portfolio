<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="presentation">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="900" height="1600" fill="#173F35"/>
  <circle cx="450" cy="900" r="330" fill="#EDE8DE"/>
  <rect x="0" y="898" width="900" height="702" fill="#173F35"/>
  <rect x="0" y="896" width="900" height="2" fill="#540212"/>
  <rect x="64" y="1180" width="772" height="1" fill="#F7F4EF" opacity="0.34"/>
  <rect x="64" y="1268" width="772" height="1" fill="#F7F4EF" opacity="0.34"/>

  <text x="64" y="120" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="500"
        letter-spacing="5.2" fill="#F7F4EF" opacity="0.78">PLACEHOLDER</text>
  <text x="64" y="1516" font-family="Georgia, 'Times New Roman', serif" font-size="46"
        fill="#F7F4EF">Summer Recap in Cali</text>

  <rect width="900" height="1600" filter="url(#grain)" opacity="0.24" style="mix-blend-mode:multiply"/>
</svg>
