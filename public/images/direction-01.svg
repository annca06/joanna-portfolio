<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="presentation">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.15" fill="rgba(31,31,28,0.26)"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#EDE8DE"/>
  <path d="M0 1000 A 640 640 0 0 1 800 360 L 800 1000 Z" fill="#173F35"/>
  <rect x="0" y="0" width="800" height="360" fill="url(#dots)" opacity="0.8"/>
  <rect x="0" y="356" width="800" height="1" fill="#1F1F1C" opacity="0.5"/>
<rect width="800" height="1000" filter="url(#grain)" opacity="0.22" style="mix-blend-mode:multiply"/>
</svg>
