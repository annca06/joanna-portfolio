  </defs>

  <rect width="900" height="1200" fill="#173F35"/>
  <path d="M900 210 A 470 470 0 0 0 108 552 L 108 1200 L 900 1200 Z" fill="#EDE8DE" opacity="0.94"/>
  <rect x="108" y="880" width="792" height="150" fill="#1F1F1C" opacity="0.9"/>
  <rect x="108" y="552" width="792" height="328" fill="url(#dots)" opacity="0.5"/>
  <rect x="0" y="0" width="108" height="1200" fill="#540212" opacity="0.9"/>
  <rect x="108" y="1030" width="792" height="170" fill="#EDE8DE"/>
<rect width="900" height="1200" filter="url(#grain)" opacity="0.26" style="mix-blend-mode:multiply"/>
