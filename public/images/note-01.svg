<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" width="900" height="1125" role="presentation">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="4.5" cy="4.5" r="1.3" fill="rgba(31,31,28,0.32)"/>
    </pattern>
  </defs>

  <rect width="900" height="1125" fill="#EDE8DE"/>
  <rect x="0" y="0" width="900" height="470" fill="url(#dots)" opacity="0.7"/>
  <circle cx="612" cy="392" r="252" fill="#173F35"/>
  <rect x="70" y="700" width="430" height="425" fill="#540212"/>
  <rect x="560" y="700" width="1" height="425" fill="#1F1F1C" opacity="0.45"/>
  <rect x="70" y="644" width="760" height="1" fill="#1F1F1C" opacity="0.45"/>
<rect width="900" height="1125" filter="url(#grain)" opacity="0.22" style="mix-blend-mode:multiply"/>
</svg>
