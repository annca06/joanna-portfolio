<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="presentation">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.15" fill="rgba(31,31,28,0.28)"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#EDE8DE"/>
  <rect x="760" y="0" width="440" height="900" fill="#173F35"/>
  <rect x="90" y="120" width="560" height="1" fill="#1F1F1C" opacity="0.5"/>
  <rect x="90" y="176" width="560" height="120" fill="#1F1F1C" opacity="0.88"/>
  <rect x="90" y="360" width="380" height="1" fill="#1F1F1C" opacity="0.5"/>
  <rect x="90" y="410" width="560" height="330" fill="url(#dots)" opacity="0.85"/>
  <rect x="860" y="640" width="240" height="140" fill="#540212"/>
<rect width="1200" height="900" filter="url(#grain)" opacity="0.2" style="mix-blend-mode:multiply"/>
</svg>
