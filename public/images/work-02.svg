<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="presentation">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.15" fill="rgba(247,244,239,0.42)"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#173F35"/>
  <circle cx="440" cy="400" r="290" fill="#EDE8DE"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#dots)" opacity="0.32"/>
  <rect x="820" y="140" width="260" height="520" fill="#EDE8DE" opacity="0.92"/>
  <rect x="820" y="140" width="260" height="130" fill="#540212"/>
<rect width="1200" height="800" filter="url(#grain)" opacity="0.24" style="mix-blend-mode:multiply"/>
</svg>
